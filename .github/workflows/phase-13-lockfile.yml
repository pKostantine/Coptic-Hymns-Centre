name: Phase 13 lockfile sync

on:
  push:
    branches:
      - phase-13-offline-downloads

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-13-offline-downloads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Phase 13: sync package lock [lockfile-sync]"
          git push origin HEAD:phase-13-offline-downloads
