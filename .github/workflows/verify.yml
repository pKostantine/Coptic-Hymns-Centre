name: Verify CHC

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed surfaces
        run: >
          npx eslint
          src/app/account.tsx
          src/app/downloads.tsx
          "src/app/music/playlist/[id].tsx"
          src/components/chc/ui/Icon.tsx
          src/components/offline/OfflineDownloadButton.tsx
          src/components/music/MusicPlaylistPicker.tsx
          src/components/music/MusicQueueList.tsx
          src/components/music/MusicTrackActionsMenu.tsx
          src/context/AuthContext.tsx
          src/services/offlineDownloadRequests.ts
          src/services/offlineDatabase.ts
          src/services/profileAvatarService.ts
      - name: Lint Library route
        run: npx eslint "src/app/music/library.tsx" --rule "react-hooks/set-state-in-effect: off" --rule "react-hooks/exhaustive-deps: off"
      - name: Playback tests
        run: npm run test:playback
      - name: Offline request tests
        run: npm run test:offline
      - name: Slideshow and Bible regression tests
        run: npm run test:slideshow
      - name: Reading font-size and migration tests
        run: npm run test:reading
      - name: Validate media processor (including multi-GB video)
        working-directory: workers/media-processor
        run: npm ci --no-audit --no-fund && npm test
      - name: Web export
        run: npx expo export -p web
