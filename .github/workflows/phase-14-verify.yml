name: Phase 14 verification
on:
  push:
    branches: [phase-14-download-versioning-storage]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14-download-versioning-storage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        if: ${{ !contains(github.event.head_commit.message, '[phase14-lock]') }}
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Phase 14: sync package lock [phase14-lock]"
            git push origin HEAD:phase-14-download-versioning-storage
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:playback
      - run: npm run test:lyrics
      - run: npm run test:conditions
      - run: npm run test:slideshow
