name: Mark Completed Media Phases

on:
  push:
    branches:
      - phase-8-music-consumer
    paths:
      - .github/workflows/phase-8-refresh-lock.yml

permissions:
  contents: write

jobs:
  mark-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8-music-consumer
      - name: Mark Phase 7 and Phase 8 complete
        shell: python
        run: |
          from pathlib import Path

          path = Path('CHC_Media_Platform_Implementation_Phases.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '# Phase 7 — Synchronized Lyrics',
              '# Phase 7 ✅ — Synchronized Lyrics',
              1,
          )
          text = text.replace(
              '# Phase 8 — Hymns & Songs Consumer Experience',
              '# Phase 8 ✅ — Hymns & Songs Consumer Experience',
              1,
          )

          deliverable = '''## Deliverable

A polished streaming music experience exists inside CHC and visually belongs to the same application as Books.'''
          completion = '''## Deliverable

A polished streaming music experience exists inside CHC and visually belongs to the same application as Books.

## Phase 8 Completion — 2026-09-16

Status: complete. The main CHC application now contains a consumer Hymns & Songs experience backed by the published music catalog, Cloudflare R2 delivery assets, user-library RLS, and Phase 7 synchronized lyrics.

Implemented:

- Music Home / discovery, artist pages, localized release pages, and ordered track lists.
- Music search across published artists, releases, and tracks.
- Library with Liked Songs and private playlists for authenticated users.
- Mini player, full Now Playing, queue navigation, seeking, and in-app playback through Expo Audio.
- Multiple synchronized lyric sets with live active-line highlighting and tap-to-seek.
- Arabic-aware consumer metadata and RTL lyric presentation.
- Download actions are present in the Music experience; persistent offline storage remains Phase 13/14 work.
- Consumer catalog/library RPCs use `SECURITY INVOKER` and preserve the existing music RLS model.
- Added `docs/media-platform/phase-8-hymns-songs-consumer-experience.md` with the implementation and verification record.

Verified:

- Published Phase 6 smoke catalog can be discovered, opened, queued, and resolved to its published R2 audio asset.
- Published Phase 7 English and Arabic lyric sets are consumable by Now Playing.
- Authenticated Like/playlist create/add/read/remove paths work through RLS.
- A private playlist returns `null` when queried under the actual `anon` database role.
- Supabase advisors report no new Phase 8 security-definer findings.
- `npm ci --ignore-scripts`, `npx tsc --noEmit`, and `npm run test:lyrics` passed on the Phase 8 branch.

Playback architecture note: Phase 8 includes the in-app playback layer needed for a functional Music experience. Phase 9 remains responsible for the robust global/background playback engine, lock-screen controls, persistence, and shared Music/Learn playback foundation.'''

          if '## Phase 8 Completion — 2026-09-16' not in text:
              if deliverable not in text:
                  raise SystemExit('Phase 8 deliverable anchor not found')
              text = text.replace(deliverable, completion, 1)

          if '# Phase 7 ✅ — Synchronized Lyrics' not in text:
              raise SystemExit('Phase 7 completion heading not written')
          if '# Phase 8 ✅ — Hymns & Songs Consumer Experience' not in text:
              raise SystemExit('Phase 8 completion heading not written')

          path.write_text(text, encoding='utf-8')
      - name: Commit phase status
        run: |
          if git diff --quiet -- CHC_Media_Platform_Implementation_Phases.md; then
            echo "Phase document already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHC_Media_Platform_Implementation_Phases.md
          git commit -m "Mark media phases 7 and 8 complete"
          git push origin HEAD:phase-8-music-consumer
