name: Mark Completed Media Phases

on:
  push:
    branches:
      - phase-8-music-consumer
    paths:
      - .github/workflows/phase-8-refresh-lock.yml

permissions:
  contents: write

jobs:
  mark-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8-music-consumer
      - name: Update phase headings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHC_Media_Platform_Implementation_Phases.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("# Phase 7 — Synchronized Lyrics", "# Phase 7 ✅ — Synchronized Lyrics", 1)
          text = text.replace("# Phase 8 — Hymns & Songs Consumer Experience", "# Phase 8 ✅ — Hymns & Songs Consumer Experience", 1)
          if "# Phase 7 ✅ — Synchronized Lyrics" not in text:
              raise SystemExit("Phase 7 heading was not updated")
          if "# Phase 8 ✅ — Hymns & Songs Consumer Experience" not in text:
              raise SystemExit("Phase 8 heading was not updated")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit phase status
        run: |
          if git diff --quiet -- CHC_Media_Platform_Implementation_Phases.md; then
            echo "Phase headings already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHC_Media_Platform_Implementation_Phases.md
          git commit -m "Mark media phases 7 and 8 complete"
          git push origin HEAD:phase-8-music-consumer
