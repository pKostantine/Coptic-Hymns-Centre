name: Phase 8 Verify

on:
  push:
    branches:
      - phase-8-music-consumer
    paths:
      - .github/workflows/phase-8-refresh-lock.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8-music-consumer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Synchronized lyric tests
        run: npm run test:lyrics
