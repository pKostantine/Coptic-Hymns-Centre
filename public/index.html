<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003566" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Coptic Hymns Centre</title>
    <!-- web.output: "single" uses this template, not src/app/+html.tsx. -->
    <style id="expo-reset">
      html,
      body,
      #root {
        height: 100%;
        background-color: #003566;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1;
      }
      /* Follow Safari's visible viewport as its toolbars expand or collapse. */
      @supports (height: 100dvh) {
        body {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
